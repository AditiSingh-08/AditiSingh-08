<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Aditi Singh, Software Developer. Backend by day, LLM whisperer by night." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0618"/>
      <stop offset="0.55" stop-color="#150B38"/>
      <stop offset="1" stop-color="#241052"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="420" rx="22"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .kw { fill: #FF79C6; }
    .fn { fill: #7DD3FC; }
    .st { fill: #A7F3B0; }
    .cm { fill: #7C7A96; }
    .tx { fill: #E8E6FF; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(18px, -10px); } }
    .bob1 { animation: bob 4s ease-in-out infinite; }
    .bob2 { animation: bob 5s ease-in-out infinite 0.8s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .glow { animation: drift 9s ease-in-out infinite; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <circle class="glow" cx="1050" cy="120" r="260" fill="url(#glowA)"/>
    <circle class="glow" cx="260" cy="400" r="230" fill="url(#glowB)"/>

    <!-- left: identity -->
    <text x="70" y="92" class="mono" font-size="17" fill="#A78BFA" letter-spacing="1">&lt;hello_world /&gt;</text>
    <rect x="70" y="112" width="5" height="128" rx="2.5" fill="url(#accent)"/>
    <text x="96" y="168" class="sans" font-size="72" font-weight="800" letter-spacing="4" fill="#FFFFFF">ADITI SINGH</text>
    <text x="98" y="218" class="sans" font-size="29" font-weight="600" letter-spacing="9" fill="url(#accent)">SOFTWARE DEVELOPER</text>
    <text x="98" y="256" class="sans" font-size="20" fill="#CFCBF5">Backend by day. LLM whisperer by night. Debugger by necessity.</text>

    <!-- skill chips -->
    <g class="mono" font-size="15" fill="#E8E6FF">
      <g transform="translate(70,292)"><rect width="82" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="41" y="22" text-anchor="middle">Python</text></g>
      <g transform="translate(162,292)"><rect width="64" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="32" y="22" text-anchor="middle">Java</text></g>
      <g transform="translate(236,292)"><rect width="55" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#7C5CFF" stroke-opacity="0.6"/><text x="27.5" y="22" text-anchor="middle">C++</text></g>
      <g transform="translate(301,292)"><rect width="91" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.6"/><text x="45.5" y="22" text-anchor="middle">FastAPI</text></g>
      <g transform="translate(402,292)"><rect width="55" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.6"/><text x="27.5" y="22" text-anchor="middle">SQL</text></g>
      <g transform="translate(467,292)"><rect width="55" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#F472B6" stroke-opacity="0.6"/><text x="27.5" y="22" text-anchor="middle">RAG</text></g>
      <g transform="translate(532,292)"><rect width="109" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#F472B6" stroke-opacity="0.6"/><text x="54.5" y="22" text-anchor="middle">LangChain</text></g>
    </g>

    <text x="70" y="384" class="mono" font-size="14" fill="#8B88B0">// open to: Software Engineer · Backend · Python · AI/ML · GET</text>

    <!-- right: code window -->
    <g>
      <rect x="740" y="60" width="470" height="280" rx="16" fill="#0E0A24" stroke="#7C5CFF" stroke-opacity="0.45"/>
      <path d="M740 76a16 16 0 0 1 16-16h438a16 16 0 0 1 16 16v16H740z" fill="#1A1238"/>
      <circle cx="764" cy="76" r="6" fill="#FF5F57"/>
      <circle cx="786" cy="76" r="6" fill="#FEBC2E"/>
      <circle cx="808" cy="76" r="6" fill="#28C840"/>
      <text x="975" y="81" class="mono" font-size="13" fill="#8B88B0" text-anchor="middle">aditi.py</text>

      <g class="mono" font-size="17" xml:space="preserve">
        <text x="772" y="130"><tspan class="kw">class</tspan><tspan class="fn"> Aditi</tspan><tspan class="tx">(Developer):</tspan></text>
        <text x="772" y="158"><tspan class="tx">    stack = [</tspan><tspan class="st">"Python"</tspan><tspan class="tx">, </tspan><tspan class="st">"Java"</tspan><tspan class="tx">, </tspan><tspan class="st">"C++"</tspan><tspan class="tx">]</tspan></text>
        <text x="772" y="186"><tspan class="kw">    def</tspan><tspan class="fn"> work</tspan><tspan class="tx">(self):</tspan></text>
        <text x="772" y="214"><tspan class="fn">        ship</tspan><tspan class="tx">(backend_apis)</tspan></text>
        <text x="772" y="242"><tspan class="fn">        teach</tspan><tspan class="tx">(llm, manners=</tspan><tspan class="kw">True</tspan><tspan class="tx">)</tspan></text>
        <text x="772" y="270"><tspan class="fn">        fix</tspan><tspan class="tx">(bugs, blame=</tspan><tspan class="st">"cache"</tspan><tspan class="tx">)</tspan></text>
        <text x="772" y="298"><tspan class="kw">        return</tspan><tspan class="st"> "works on my machine"</tspan></text>
      </g>
      <rect class="cursor" x="1142" y="283" width="9" height="19" fill="#A78BFA"/>
    </g>

    <!-- floating stickers -->
    <g class="bob1">
      <g transform="translate(1090,350) rotate(-4)">
        <rect width="104" height="32" rx="9" fill="#16A34A"/>
        <text x="52" y="21" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#FFFFFF">200 OK</text>
      </g>
    </g>
    <g class="bob2">
      <g transform="translate(846,352) rotate(3)">
        <rect width="190" height="32" rx="9" fill="#F59E0B"/>
        <text x="95" y="21" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#1B1303">TODO: sleep, someday</text>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
